name: CI

# Arquivos que não entram na imagem nem no type check (espelha o .dockerignore)
# não disparam o pipeline. O filtro só pula quando TODOS os arquivos do push
# batem na lista; misturou com código-fonte, roda normal. Pushes de tag v*
# ignoram filtros de path e sempre disparam.
# Atenção: paths-ignore não aceita negação (!) — se um dia messages/ ganhar
# arquivos .md consumidos pelo app, troque '**.md' por caminhos explícitos.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      # GitHub Actions não suporta âncoras YAML; a lista se repete no pull_request.
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.claude/**'
      - '.mcp.json'
      - '.vscode/**'
      - '.env.example'
      - 'typst/**'
      - 'deploy/**'
      - 'docker-compose*.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.claude/**'
      - '.mcp.json'
      - '.vscode/**'
      - '.env.example'
      - 'typst/**'
      - 'deploy/**'
      - 'docker-compose*.yml'
  workflow_dispatch: # enables the "Run workflow" button in the Actions tab

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check:
    name: Type check e build
    runs-on: ubuntu-latest
    # Commits "chore:" (docs, ajustes sem código) não disparam o pipeline.
    # Em PRs head_commit é nulo, então startsWith dá false e o job roda normalmente.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore:') }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      # src/lib/paraglide é gerado, então não está no repositório; o script `check`
      # compila as mensagens antes de rodar o svelte-check.
      # O `vite build` em si não roda aqui: o job de imagem já compila o app
      # dentro do Dockerfile, inclusive em PRs (só o push é pulado).
      - name: svelte-check
        run: bun run check

  build:
    name: Build e push da imagem
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags da imagem do app)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Metadata (tags da imagem de migração)
        id: meta_tools
        uses: docker/metadata-action@v5
        with:
          bake-target: docker-metadata-action-tools
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-tools
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # Um único bake constrói app e tools no mesmo grafo: os estágios comuns
      # (deps, cópia do fonte) são computados uma vez só, com um upload de
      # contexto e um export de cache por alvo em escopos separados.
      - name: Build e push (app + tools)
        uses: docker/bake-action@v6
        with:
          source: .
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
            cwd://${{ steps.meta_tools.outputs.bake-file }}
          targets: default
          push: ${{ github.event_name != 'pull_request' }}
          set: |
            app.cache-from=type=gha,scope=app
            app.cache-to=type=gha,mode=max,scope=app
            tools.cache-from=type=gha,scope=tools
            tools.cache-to=type=gha,mode=max,scope=tools
