name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check:
    name: Type check e build
    runs-on: ubuntu-latest
    # Commits "chore:" (docs, ajustes sem código) não disparam o pipeline.
    # Em PRs head_commit é nulo, então startsWith dá false e o job roda normalmente.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore:') }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      # src/lib/paraglide é gerado, então não está no repositório; o script `check`
      # compila as mensagens antes de rodar o svelte-check.
      - name: svelte-check
        run: bun run check

      - name: Build
        run: bun run build

  build:
    name: Build e push da imagem
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags da imagem do app)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Metadata (tags da imagem de migração)
        id: meta_tools
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-tools
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build e push (app)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e push (tools)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_tools.outputs.tags }}
          labels: ${{ steps.meta_tools.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
